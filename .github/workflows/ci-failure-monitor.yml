name: CI Failure Monitor

on:
  workflow_run:
    workflows:
      - "Build and push Docker image"
    types:
      - completed
permissions:
  issues: write
  actions: read
jobs:
  monitor:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const eventName = github.event.workflow_run.name;
            const commitId = github.event.workflow_run.head_commit.id;
            const triggerActor = github.event.workflow_run.triggering_actor.login;
            const branch = github.event.workflow_run.head_branch;
            const runUrl = github.event.workflow_run.html_url;

            const title = `CI failure in "${eventName}"`;
            const body = `Commit: ${commitId} (@${triggerActor})\nRef: ${branch}\n\n[View workflow run](${runUrl})\n\n### Resolution steps\n\n1. [View workflow run](${runUrl})\n2. Review the failure logs in the job steps\n3. Fix the failing step\n4. Redeploy the commit that introduced the failure`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              title,
            });

            const existing = existingIssues.data.find(
              issue => issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: body + '\n\n---\n*Reopened by CI failure monitor*',
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            }
